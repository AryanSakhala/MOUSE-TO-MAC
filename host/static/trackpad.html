<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Mouse to Mac</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0c10;
      --surface: #12151c;
      --surface-2: #1a1f2a;
      --line: #2a3140;
      --text: #f2f4f8;
      --muted: #8b93a7;
      --accent: #6ee7b7;
      --press: #243041;
      --danger: #f87171;
      --radius: 22px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(120% 80% at 50% -10%, #151b28 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none; user-select: none;
    }
    #app {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b));
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 4px;
    }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
    .brand span { color: var(--muted); font-weight: 500; }
    #status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      padding: 7px 11px; border-radius: 999px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    }
    #status i {
      width: 7px; height: 7px; border-radius: 50%;
      background: #64748b; display: block;
    }
    #status.ok { color: var(--accent); border-color: rgba(110,231,183,0.25); }
    #status.ok i { background: var(--accent); box-shadow: 0 0 10px rgba(110,231,183,0.55); }
    #status.bad { color: var(--danger); border-color: rgba(248,113,113,0.25); }
    #status.bad i { background: var(--danger); }

    .mouse-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 4px;
      border-radius: 28px;
      background: linear-gradient(180deg, #171c27, #10141c);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .mbtn {
      appearance: none; border: 0; cursor: pointer;
      min-height: 74px;
      border-radius: 22px;
      background: linear-gradient(180deg, #222836, #171c26);
      color: var(--text);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      font-weight: 650; font-size: 13px; letter-spacing: 0.02em;
      transition: transform 80ms ease, background 80ms ease, box-shadow 80ms ease;
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
      -webkit-user-select: none; user-select: none;
    }
    .mbtn small {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .mbtn:active, .mbtn.down {
      transform: translateY(1px) scale(0.985);
      background: var(--press);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.45);
    }

    #pad {
      position: relative;
      min-height: 0;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%),
        var(--surface);
      border: 1px solid var(--line);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    #pad.dragging {
      border-color: rgba(110,231,183,0.45);
      box-shadow: inset 0 0 0 1px rgba(110,231,183,0.12);
    }
    #pad::before {
      content: "";
      position: absolute; inset: 18px;
      border-radius: 16px;
      border: 1px dashed rgba(139,147,167,0.18);
      pointer-events: none;
    }
    .pad-copy {
      text-align: center; pointer-events: none; z-index: 1;
      padding: 0 28px;
    }
    .pad-copy strong {
      display: block; font-size: 18px; font-weight: 650;
      letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .pad-copy p {
      margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45;
    }
    #ripple {
      position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px;
      border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(110,231,183,0.35), transparent 70%);
      transform: scale(0.4);
    }
    #ripple.on { animation: rip 380ms ease-out; }
    @keyframes rip {
      from { opacity: 0.9; transform: scale(0.35); }
      to { opacity: 0; transform: scale(1.8); }
    }

    .dock {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
      padding: 4px 2px 0;
    }
    .sens {
      display: flex; align-items: center; gap: 8px;
      justify-content: flex-start;
    }
    .sens label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .chip {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface-2); color: var(--text);
      font-size: 18px; font-weight: 700;
      display: grid; place-items: center;
    }
    .chip:active { background: var(--press); }
    #sensVal {
      min-width: 2.4em; text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 12px; color: var(--text); font-weight: 650;
    }
    .tips {
      grid-column: 1 / -1;
      margin: 0; text-align: center;
      color: var(--muted); font-size: 11px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Mouse <span>to Mac</span></div>
      <div id="status"><i></i><b>Connecting</b></div>
    </header>

    <div class="mouse-top" aria-label="Mouse buttons">
      <button type="button" class="mbtn left" id="left" aria-label="Left click">
        <span>Left</span>
        <small>Hold to drag</small>
      </button>
      <button type="button" class="mbtn right" id="right" aria-label="Right click">
        <span>Right</span>
        <small>Hold / menu</small>
      </button>
    </div>

    <div id="pad" role="application" aria-label="Trackpad">
      <div id="ripple"></div>
      <div class="pad-copy">
        <strong>Trackpad</strong>
        <p>Glide to move · tap to click · double-tap+hold+drag to select</p>
      </div>
    </div>

    <div class="dock">
      <div class="sens">
        <label>Speed</label>
        <button type="button" class="chip" id="sensDown" aria-label="Slower">−</button>
        <div id="sensVal">1.8</div>
        <button type="button" class="chip" id="sensUp" aria-label="Faster">+</button>
      </div>
      <div></div>
      <div></div>
      <p class="tips">1-finger glide = move only · double-tap then hold &amp; drag = select · 2-finger = scroll</p>
    </div>
  </div>

  <script>
    const OP_MOVE = 1, OP_SCROLL = 2, OP_CLICK = 3, OP_SPACE = 4, OP_DOWN = 5, OP_UP = 6;
    const BTN_LEFT = 0, BTN_RIGHT = 1, BTN_DOUBLE = 2;
    const SPACE_LEFT = 0, SPACE_RIGHT = 1, SPACE_UP = 2, SPACE_DOWN = 3;

    const statusEl = document.getElementById("status");
    const statusText = statusEl.querySelector("b");
    const pad = document.getElementById("pad");
    const leftBtn = document.getElementById("left");
    const rightBtn = document.getElementById("right");
    const ripple = document.getElementById("ripple");
    const sensVal = document.getElementById("sensVal");

    let baseGain = 1.75;
    const ACCEL = 0.055;
    const SPACE_THRESHOLD = 80;
    const MOVE_SLOP = 8;
    const DOUBLE_MS = 420;
    const LONG_MS = 450;
    const SEND_MIN_MS = 3;

    let ws = null;
    let last = null;
    let travel = 0;
    let scrolling = false;
    let spaceMode = false;
    let spaceDx = 0, spaceDy = 0;
    let longTimer = 0;
    let longFired = false;
    let lastTapAt = 0;
    let pendingSingle = 0;
    let selectArmed = false;
    let accDx = 0, accDy = 0, accScroll = 0;
    let raf = 0;
    let lastSend = 0;
    let uiLeft = false;
    let uiRight = false;
    let padDragging = false;
    const moveBuf = new ArrayBuffer(9);
    const moveView = new DataView(moveBuf);
    const scrollBuf = new ArrayBuffer(5);
    const scrollView = new DataView(scrollBuf);

    function setStatus(text, cls) {
      statusText.textContent = text;
      statusEl.className = cls || "";
    }

    function flashRipple(x, y) {
      const r = pad.getBoundingClientRect();
      ripple.style.left = (x - r.left) + "px";
      ripple.style.top = (y - r.top) + "px";
      ripple.classList.remove("on");
      void ripple.offsetWidth;
      ripple.classList.add("on");
    }

    function accel(dx, dy) {
      const mag = Math.hypot(dx, dy);
      if (mag < 0.001) return [0, 0];
      const gain = baseGain * (1 + ACCEL * mag);
      return [dx * gain, dy * gain];
    }

    function packClick(btn) {
      const buf = new ArrayBuffer(2);
      const v = new DataView(buf);
      v.setUint8(0, OP_CLICK);
      v.setUint8(1, btn);
      return buf;
    }
    function packButton(op, btn) {
      const buf = new ArrayBuffer(2);
      const v = new DataView(buf);
      v.setUint8(0, op);
      v.setUint8(1, btn);
      return buf;
    }
    function packSpace(dir) {
      const buf = new ArrayBuffer(2);
      const v = new DataView(buf);
      v.setUint8(0, OP_SPACE);
      v.setUint8(1, dir);
      return buf;
    }

    function flush() {
      raf = 0;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        accDx = accDy = accScroll = 0;
        return;
      }
      if (accDx !== 0 || accDy !== 0) {
        moveView.setUint8(0, OP_MOVE);
        moveView.setFloat32(1, accDx, true);
        moveView.setFloat32(5, accDy, true);
        ws.send(moveBuf);
        accDx = accDy = 0;
      }
      if (accScroll !== 0) {
        scrollView.setUint8(0, OP_SCROLL);
        scrollView.setFloat32(1, accScroll, true);
        ws.send(scrollBuf);
        accScroll = 0;
      }
      lastSend = performance.now();
    }

    function scheduleFlush() {
      const now = performance.now();
      if (now - lastSend >= SEND_MIN_MS) {
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        flush();
        return;
      }
      if (!raf) raf = requestAnimationFrame(flush);
    }

    function queueMove(dx, dy) {
      const [ax, ay] = accel(dx, dy);
      accDx += ax; accDy += ay;
      scheduleFlush();
    }
    function queueScroll(dy) {
      accScroll += dy * baseGain;
      scheduleFlush();
    }
    function sendClick(btn) {
      if (raf) { cancelAnimationFrame(raf); flush(); } else flush();
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(packClick(btn));
    }
    function sendDown(btn) {
      if (raf) { cancelAnimationFrame(raf); flush(); } else flush();
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(packButton(OP_DOWN, btn));
    }
    function sendUp(btn) {
      if (raf) { cancelAnimationFrame(raf); flush(); } else flush();
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(packButton(OP_UP, btn));
    }
    function sendSpace(dir) {
      if (raf) { cancelAnimationFrame(raf); flush(); } else flush();
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(packSpace(dir));
    }

    function beginPadDrag() {
      if (padDragging || uiLeft || uiRight) return;
      padDragging = true;
      sendDown(BTN_LEFT);
      pad.classList.add("dragging");
    }
    function endPadDrag() {
      if (!padDragging) return;
      padDragging = false;
      sendUp(BTN_LEFT);
      pad.classList.remove("dragging");
    }

    function clearLong() {
      if (longTimer) { clearTimeout(longTimer); longTimer = 0; }
    }
    function clearPendingSingle() {
      if (pendingSingle) { clearTimeout(pendingSingle); pendingSingle = 0; }
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) await navigator.wakeLock.request("screen");
      } catch (_) {}
    }

    function midTouches(touches) {
      let x = 0, y = 0;
      for (let i = 0; i < touches.length; i++) {
        x += touches[i].clientX;
        y += touches[i].clientY;
      }
      return { x: x / touches.length, y: y / touches.length };
    }

    function wasTap() {
      return travel < MOVE_SLOP && !scrolling && !spaceMode && !longFired && !padDragging;
    }

    function bindHold(btn, which) {
      const press = (e) => {
        e.preventDefault();
        e.stopPropagation();
        btn.classList.add("down");
        clearPendingSingle();
        lastTapAt = 0;
        endPadDrag();
        if (which === BTN_LEFT) {
          if (uiLeft) return;
          uiLeft = true;
          sendDown(BTN_LEFT);
        } else {
          if (uiRight) return;
          uiRight = true;
          sendDown(BTN_RIGHT);
        }
      };
      const release = (e) => {
        if (e) e.preventDefault();
        btn.classList.remove("down");
        if (which === BTN_LEFT) {
          if (!uiLeft) return;
          uiLeft = false;
          sendUp(BTN_LEFT);
        } else {
          if (!uiRight) return;
          uiRight = false;
          sendUp(BTN_RIGHT);
        }
      };
      btn.addEventListener("touchstart", press, { passive: false });
      btn.addEventListener("touchend", release, { passive: false });
      btn.addEventListener("touchcancel", release, { passive: false });
      btn.addEventListener("mousedown", press);
      btn.addEventListener("mouseup", release);
      btn.addEventListener("mouseleave", release);
    }
    bindHold(leftBtn, BTN_LEFT);
    bindHold(rightBtn, BTN_RIGHT);

    pad.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const now = performance.now();
      travel = 0;
      longFired = false;
      scrolling = e.touches.length === 2;
      spaceMode = e.touches.length >= 3;
      spaceDx = spaceDy = 0;
      last = midTouches(e.touches);
      clearLong();

      // Second tap soon after first → arm select (do not click yet)
      selectArmed = !!(e.touches.length === 1 && lastTapAt && (now - lastTapAt) < DOUBLE_MS);
      if (selectArmed) clearPendingSingle();

      if (e.touches.length === 1) {
        flashRipple(e.touches[0].clientX, e.touches[0].clientY);
        longTimer = setTimeout(() => {
          if (travel < MOVE_SLOP && !scrolling && !spaceMode && !uiLeft && !padDragging && !selectArmed) {
            longFired = true;
            clearPendingSingle();
            lastTapAt = 0;
            sendClick(BTN_RIGHT);
          }
        }, LONG_MS);
      }
    }, { passive: false });

    pad.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (!last) return;
      const cur = midTouches(e.touches);
      const rawDx = cur.x - last.x;
      const rawDy = cur.y - last.y;
      travel += Math.hypot(rawDx, rawDy);
      if (travel >= MOVE_SLOP) clearLong();

      if (e.touches.length >= 3 || spaceMode) {
        spaceMode = true;
        spaceDx += rawDx; spaceDy += rawDy;
        last = cur;
        return;
      }
      if (e.touches.length === 2) {
        scrolling = true;
        clearLong();
        endPadDrag();
        selectArmed = false;
        last = cur;
        if (rawDy !== 0) queueScroll(-rawDy);
        return;
      }
      last = cur;
      if (travel < MOVE_SLOP) return;

      // Glide alone = move only. Select only if double-tap armed or Left held.
      if (selectArmed || uiLeft) beginPadDrag();
      queueMove(rawDx, rawDy);
    }, { passive: false });

    pad.addEventListener("touchend", (e) => {
      e.preventDefault();
      clearLong();
      const now = performance.now();

      if (spaceMode && e.touches.length === 0) {
        clearPendingSingle();
        lastTapAt = 0;
        selectArmed = false;
        endPadDrag();
        const ax = Math.abs(spaceDx), ay = Math.abs(spaceDy);
        if (ax > SPACE_THRESHOLD || ay > SPACE_THRESHOLD) {
          if (ax >= ay) sendSpace(spaceDx < 0 ? SPACE_LEFT : SPACE_RIGHT);
          else sendSpace(spaceDy < 0 ? SPACE_UP : SPACE_DOWN);
        }
        spaceMode = false; last = null; scrolling = false;
        return;
      }

      if (e.touches.length === 0) {
        const dragged = padDragging;
        const armed = selectArmed;
        endPadDrag();
        selectArmed = false;

        if (!dragged && wasTap()) {
          if (armed) {
            clearPendingSingle();
            lastTapAt = 0;
            sendClick(BTN_DOUBLE);
          } else {
            lastTapAt = now;
            clearPendingSingle();
            pendingSingle = setTimeout(() => {
              pendingSingle = 0;
              lastTapAt = 0;
              sendClick(BTN_LEFT);
            }, DOUBLE_MS);
          }
        } else if (dragged) {
          lastTapAt = 0;
        }

        if (raf) { cancelAnimationFrame(raf); flush(); }
        last = null; scrolling = false; spaceMode = false; travel = 0;
      } else {
        last = midTouches(e.touches);
      }
    }, { passive: false });

    pad.addEventListener("touchcancel", () => {
      clearLong(); clearPendingSingle();
      endPadDrag();
      selectArmed = false;
      last = null; travel = 0; scrolling = false; spaceMode = false; longFired = false;
    });

    function renderSens() {
      sensVal.textContent = baseGain.toFixed(1);
    }
    document.getElementById("sensDown").onclick = () => {
      baseGain = Math.max(0.6, +(baseGain - 0.2).toFixed(1));
      renderSens();
    };
    document.getElementById("sensUp").onclick = () => {
      baseGain = Math.min(3.5, +(baseGain + 0.2).toFixed(1));
      renderSens();
    };
    renderSens();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    function connect() {
      const url = (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + "/" + location.search;
      setStatus("Connecting");
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => { setStatus("Live", "ok"); requestWakeLock(); };
      ws.onclose = () => {
        uiLeft = false;
        uiRight = false;
        padDragging = false;
        setStatus("Reconnecting", "bad");
        setTimeout(connect, 700);
      };
      ws.onerror = () => setStatus("Error", "bad");
    }

    connect();
  </script>
</body>
</html>
